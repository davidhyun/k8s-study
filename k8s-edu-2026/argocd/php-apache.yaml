apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: myproject
  name: php-apache
spec:
  selector:
    matchLabels:
      run: php-apache
  template:
    metadata:
      labels:
        run: php-apache
    spec:
      containers:
      - name: php-apache
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
          requests: # hpa는 limits 설정과는 관계가 없고 requests 설정만 관계 있다
            cpu: 200m

---
apiVersion: v1
kind: Service
metadata:
  namespace: myproject
  name: php-apache
  labels:
    run: php-apache
spec:
  ports:
  - port: 80
  selector:
    run: php-apache
